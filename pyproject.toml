[project]
name = "etf-minute-fetcher"
version = "0.2.0"
description = "抓取沪深 ETF 分钟行情，并按 ETF 和交易日分区保存为 Parquet。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.94,<2",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<1",
    "ty>=0.0.70,<1",
]

[project.scripts]
etf-min = "etf_minute_fetcher.cli:main"
etf-min-check = "etf_minute_fetcher.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_minute_fetcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.coverage.run]
branch = true
source = ["etf_minute_fetcher"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
